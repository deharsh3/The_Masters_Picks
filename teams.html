<!DOCTYPE html>
<html>

<head>

<title>Submitted Teams</title>

<link rel="stylesheet" href="styles.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

</head>

<body class="valspar">

<div id="header">

<div class="hero-image">

</div>

</div>

<div id="navbar">

<a href="index.html">Submit Picks</a>

<a href="teams.html">View Teams</a>

<a href="tournament.html">PGA Tournament Leaderboard</a>

<a href="leaderboard.html">Pool Leaderboard</a>

</div>

<h1>Submitted Teams</h1>

<div style="margin-bottom:10px;">
<input
class="teamSearch"
id="teamSearch"
type="text"
placeholder="Search for your team..."
onkeyup="filterTeams()"
>
</div>

<div id="teams"></div>

<script>

document.addEventListener("DOMContentLoaded", () => {

const params = new URLSearchParams(window.location.search)
const poolParam = params.get("pool")

if(poolParam){
localStorage.setItem("pool", poolParam)
}

if(!localStorage.getItem("pool")){
window.location.href="pool.html"
}

})

const params = new URLSearchParams(window.location.search)

const poolParam = params.get("pool")

if(poolParam){
localStorage.setItem("pool",poolParam)
}

const TEAMS_ENDPOINT =
"https://pufdcfsgdabjtnxfxuat.supabase.co/rest/v1/teams?select=*"

const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1ZmRjZnNnZGFianRueGZ4dWF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0NjA0MDIsImV4cCI6MjA4OTAzNjQwMn0.p8BiiUN6uHOcVQVDEOEAgc-B4ZsyLQtDqsIZ-tnu63c"

async function loadTeams(){

const pool = localStorage.getItem("pool")

const res = await fetch(
`${TEAMS_ENDPOINT}&pool_name=eq.${pool}`,
{
headers:{
apikey:API_KEY,
Authorization:`Bearer ${API_KEY}`
}
})

const teams = await res.json()

console.log("Loaded teams:", teams)

const container = document.getElementById("teams")

teams
.sort((a,b)=>a.name.localeCompare(b.name))
.forEach(team=>{

const div=document.createElement("div")

div.className="team"

const players = Array.isArray(team.players_display)
  ? team.players_display
  : JSON.parse(team.players_display)

const playersHTML = players
.map(p=>`<li>${titleCase(p.name)} (${p.odds})</li>`)
.join("")

div.innerHTML=`

<h3 onclick="togglePlayers(this)">
<span class="arrow">▶</span>
${team.name}
</h3>

<ul class="players">
${playersHTML}
</ul>

`

container.appendChild(div)

})

}

function togglePlayers(el){

const players = el.nextElementSibling
const arrow = el.querySelector(".arrow")

const expanded = players.style.display === "block"

players.style.display =
expanded ? "none" : "block"

arrow.textContent =
expanded ? "▶" : "▼"

}

function titleCase(name){

return name.replace(/\b\w/g, c => c.toUpperCase())

}

function filterTeams(){

const input =
document.getElementById("teamSearch")
.value
.toLowerCase()

const teams =
document.querySelectorAll(".team")

teams.forEach(team=>{

const name =
team.innerText.toLowerCase()

team.style.display =
name.includes(input)
? ""
: "none"

})

}

loadTeams()

</script>

</body>

</html>
